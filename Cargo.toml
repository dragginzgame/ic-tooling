[workspace]
members = [
    "crates/ic-build",
    "crates/ic-cargo-qualification",
    "crates/ic-host-artifacts",
    "crates/ic-host-fs",
    "crates/ic-host-http",
    "crates/ic-host-process",
    "crates/ic-host-text",
    "crates/ic-testkit",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-tooling-new"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]

[workspace.dependencies]
ic-host-artifacts = { path = "crates/ic-host-artifacts", version = "0.80.1" }
ic-host-fs = { path = "crates/ic-host-fs", version = "0.80.1" }
ic-host-process = { path = "crates/ic-host-process", version = "0.80.1" }
ic-platform = { version = "=0.33.7", default-features = false }
ic-platform-types = { version = "=0.20.4", default-features = false }
pocket-ic = "=16.1.0"
reqwest = { version = "0.13.5", default-features = false }
rustix = { version = "1.1.6", features = ["fs"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
# Testkit's PocketIC requires exactly 2.0.18; other members share this selection.
thiserror = "2.0.18"
tokio = { version = "1.54.1", default-features = false }
toko-tooling = "=0.44.4"
toml = "1.2.1"
unicode-width = "0.2.3"
wasmparser = "=0.263.0"
wat = "=1.263.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"
