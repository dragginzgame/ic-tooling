[workspace]
members = [
    "apps/ic-host-wasm-inspect",
    "crates/ic-build",
    "crates/ic-host-artifacts",
    "crates/ic-host-fs",
    "crates/ic-host-http",
    "crates/ic-host-process",
    "crates/ic-host-text",
    "crates/ic-host-tools",
    "crates/ic-testkit",
    "crates/ic-testkit-dev",
    "crates/ic-testkit-native",
    "crates/ic-testkit-perf-probe",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-tooling"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Host-side artifact, filesystem, process and IC tooling"

[workspace.dependencies]
# Foundation
# Changelog : releases/foundation/CHANGELOG.md
ic-host-artifacts = { path = "crates/ic-host-artifacts", version = "0.74.4", default-features = false }
ic-host-fs = { path = "crates/ic-host-fs", version = "0.74.4", default-features = false }
ic-host-http = { path = "crates/ic-host-http", version = "0.74.4", default-features = false }
ic-host-process = { path = "crates/ic-host-process", version = "0.74.4", default-features = false }
ic-host-wasm-inspect = { path = "apps/ic-host-wasm-inspect", version = "0.74.4" }

# Build
# Changelog : releases/build/CHANGELOG.md
ic-build = { path = "crates/ic-build", version = "0.74.4", default-features = false }

# Text
# Changelog : releases/text/CHANGELOG.md
ic-host-text = { path = "crates/ic-host-text", version = "0.74.2", default-features = false }

# Host Tools
# Changelog : releases/tools/CHANGELOG.md
ic-host-tools = { path = "crates/ic-host-tools", version = "0.83.0", default-features = false }

# Testkit (Dev and perf probe are private qualification crates)
# Changelog : releases/testkit/CHANGELOG.md
ic-testkit = { path = "crates/ic-testkit", version = "0.87.0", default-features = false }
ic-testkit-dev = { path = "crates/ic-testkit-dev", version = "0.87.0" }
ic-testkit-perf-probe = { path = "crates/ic-testkit-perf-probe", version = "0.87.0" }

# Native allocation measurement
# Changelog : releases/native/CHANGELOG.md
ic-testkit-native = { path = "crates/ic-testkit-native", version = "0.80.0" }

# External production dependencies
backon = { version = "1.6.0", default-features = false, features = ["std"] }
base64 = "0.23.1"
candid = { version = "0.10.38", default-features = false }
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
cargo_metadata = "0.23.1"
command-fds = "0.3.3"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hex = "0.4.3"
ic-management-canister-types = "=0.11.0"
ic-platform = { version = "0.23.0", default-features = false }
ic-platform-runtime = { version = "0.19.0", default-features = false }
ic-platform-types = { version = "0.18.0", default-features = false }
libc = "0.2.190"
prost = "0.14.3"
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }
schemars = { version = "0.8.21", features = ["derive"] }
semver = { version = "1.0.9", features = ["serde"] }
sha2 = "0.10.9"
slog = "2.7.0"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1"
toml_edit = "0.25.17"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json", "time"] }
unicode-width = "0.2.3"
url = "2.5.7"
wasm-encoder = { version = "0.263", default-features = false }
# Wat's minor line selects the matching 0.x encoder family; upgrade these together.
wat = { version = "~1.263.0", default-features = false }
yaml_serde = "0.10.7"

# External mixed production/test dependencies
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
ic-wire = "0.17.0"
leb128 = "0.2.5"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.228", default-features = false }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false }
wasmparser = { version = "0.263", default-features = false, features = ["std", "features"] }

[workspace.lints.rust]
missing_docs = "warn"
# Reviewed macOS process queries and scoped Unix signal actions permit local FFI.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
