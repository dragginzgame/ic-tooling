[workspace]
members = [
    "crates/ic-build",
    "crates/ic-host-artifacts",
    "crates/ic-host-fs",
    "crates/ic-host-http",
    "crates/ic-host-process",
    "crates/ic-host-text",
    "crates/ic-host-tools",
    "crates/ic-host-wasm-inspect",
    "crates/ic-testkit",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-tooling"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Host-side artifact, filesystem, process and IC tooling"

[workspace.dependencies]
# Production dependencies

# Foundation
# Changelog : releases/foundation/CHANGELOG.md
ic-host-artifacts = { path = "crates/ic-host-artifacts", version = "0.76.2", default-features = false }
ic-host-fs = { path = "crates/ic-host-fs", version = "0.76.2", default-features = false }
ic-host-http = { path = "crates/ic-host-http", version = "0.76.2", default-features = false }
ic-host-process = { path = "crates/ic-host-process", version = "0.76.2", default-features = false }
ic-host-wasm-inspect = { path = "crates/ic-host-wasm-inspect", version = "0.76.2" }

# Build
# Changelog : releases/build/CHANGELOG.md
ic-build = { path = "crates/ic-build", version = "0.81.1", default-features = false }

# Text
# Changelog : releases/text/CHANGELOG.md
ic-host-text = { path = "crates/ic-host-text", version = "0.74.3", default-features = false }

# Host Tools
# Changelog : releases/tools/CHANGELOG.md
ic-host-tools = { path = "crates/ic-host-tools", version = "0.89.0", default-features = false }

# Testkit
# Changelog : releases/testkit/CHANGELOG.md
ic-testkit = { path = "crates/ic-testkit", version = "0.97.0", default-features = false }

# External production dependencies
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
cargo_metadata = "0.23.1"
command-fds = "0.3.3"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hmac = "0.13.0"
ic-platform = { version = "0.29.0", default-features = false }
ic-platform-types = { version = "0.19.0", default-features = false }
libc = "0.2.190"
pocket-ic = "16.1.0"
prost = "0.14.3"
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1"
toml_edit = "0.25.17"
unicode-width = "0.2.3"
url = "2.5.7"
wasm-encoder = { version = "0.263", default-features = false }
# Wat's minor line selects the matching 0.x encoder family; upgrade these together.
wat = { version = "~1.263.0", default-features = false }
yaml_serde = "0.10.7"

# External mixed production/test dependencies
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
ic-wire = "0.19.0"
leb128 = "0.2.5"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.228", default-features = false }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false }
wasmparser = { version = "0.263", default-features = false, features = ["std", "features"] }

# Tests and tooling only
toko-tooling = "=0.39.6"

[workspace.lints.rust]
missing_docs = "warn"
# Reviewed macOS process queries and scoped Unix signal actions permit local FFI.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
