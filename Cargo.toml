[workspace]
members = [
    "crates/ic-build",
    "crates/ic-cargo-metadata",
    "crates/ic-cargo-qualification",
    "crates/ic-host-artifacts",
    "crates/ic-host-fs",
    "crates/ic-host-http",
    "crates/ic-host-process",
    "crates/ic-host-sign",
    "crates/ic-host-text",
    "crates/ic-testkit",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-tooling"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]

[workspace.dependencies]

# Production
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
errno = "0.3.15"
ic-host-artifacts = { path = "crates/ic-host-artifacts", version = "0.80.5" }
ic-host-fs = { path = "crates/ic-host-fs", version = "0.80.5" }
ic-host-process = { path = "crates/ic-host-process", version = "0.81.2" }
ic-host-text = { path = "crates/ic-host-text", version = "0.77.3" }
ic-platform = { version = "0.34.15", default-features = false }
ic-platform-protocol = { version = "0.3.2", default-features = false }
ic-platform-types = { version = "0.21.2", default-features = false }
libproc = "0.15.0"
# Qualified client for the fixed server assets; see docs/testkit-server.md.
pocket-ic = "=16.1.0"
rustix = { version = "1.1.6", features = ["fs"] }
secret-service = { version = "5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
security-framework = "3.7.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.18"
toml = "1.2.1"
toml_edit = "0.25.19"
unicode-width = "0.2.3"
wat = "1.263.0"
zeroize = "1.9.2"

# Production and tests
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false }

# Tests and tooling
toko-tooling = "=0.45.13"
wasmparser = "0.263.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"
