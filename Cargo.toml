[workspace]
members = [
    "crates/ic-build",
    "crates/ic-host-artifacts",
    "crates/ic-host-fs",
    "crates/ic-host-http",
    "crates/ic-host-process",
    "crates/ic-host-text",
    "crates/ic-host-tools",
    "crates/ic-host-wasm-inspect",
    "crates/ic-testkit",
    "crates/ic-testkit-wire",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-tooling"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]

[workspace.dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
cargo_metadata = "0.23.1"
command-fds = "0.3.3"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hmac = "0.13.0"
ic-host-artifacts = { path = "crates/ic-host-artifacts", version = "0.77.2", default-features = false }
ic-host-fs = { path = "crates/ic-host-fs", version = "0.77.2", default-features = false }
ic-host-process = { path = "crates/ic-host-process", version = "0.77.2", default-features = false }
ic-host-text = { path = "crates/ic-host-text", version = "0.75.0", default-features = false }
ic-platform = { version = "0.33.0", default-features = false }
ic-platform-types = { version = "0.20.3", default-features = false }
ic-testkit = { path = "crates/ic-testkit", version = "0.104.0", default-features = false }
libc = "0.2.190"
pocket-ic = "16.1.0"
prost = "0.14.3"
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1"
toml_edit = "0.25.17"
unicode-width = "0.2.3"
url = "2.5.7"
wasm-encoder = { version = "0.263", default-features = false }
# Wat's minor line selects the matching 0.x encoder family; upgrade these together.
wat = { version = "~1.263.0", default-features = false }
yaml_serde = "0.10.7"

clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
ic-wire = "0.22.0"
leb128 = "0.2.5"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.228", default-features = false }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false }
wasmparser = { version = "0.263", default-features = false, features = ["std", "features"] }

toko-tooling = "=0.43.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# Reviewed macOS process queries and scoped Unix signal actions permit local FFI.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
# Retain reviewed API/style checks; experimental groups are selected individually.
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"
