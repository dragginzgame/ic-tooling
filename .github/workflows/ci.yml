name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the exact tested change
        id: classify
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
          CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.sha }}
        run: |
          scope="$(perl scripts/ci/classify-ci-change.pl --event "$CHANGE_EVENT" --ref "$CHANGE_REF" \
            --base "$CHANGE_BASE" --head "$CHANGE_HEAD" --policy ci/docs-only-paths.txt)"
          case "$scope" in docs|full) ;; *) exit 1 ;; esac
          if [[ "$scope" == docs ]]; then
            git diff --check "$CHANGE_BASE...$CHANGE_HEAD" --
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  lint-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned validation tools
        run: make install-validation-tools
      - name: Check shell and workflow sources and scan history
        run: make lint check-secrets

  native:
    needs: change-scope
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            architecture: x86_64
          - runner: macos-15-intel
            os: Darwin
            architecture: x86_64
          - runner: macos-15
            os: Darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Require a successful classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.change-scope.result }}
          CHANGE_SCOPE: ${{ needs.change-scope.outputs.scope }}
        run: |
          [[ "$CLASSIFICATION_RESULT" == success ]] || exit 1
          case "$CHANGE_SCOPE" in docs|full) ;; *) exit 1 ;; esac
      - name: Validate documentation only
        if: ${{ needs.change-scope.outputs.scope == 'docs' }}
        run: |
          bash scripts/ci/check-product-doc-links.sh
          echo 'Documentation checks passed; native qualification was not run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify native host
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          host_arguments=("$EXPECTED_OS" "$EXPECTED_ARCHITECTURE")
          if [[ "$EXPECTED_OS" == Darwin ]]; then
            host_arguments+=(15)
          fi
          bash scripts/ci/check-native-host.sh "${host_arguments[@]}"
          if [[ "$EXPECTED_OS" == Darwin ]]; then
            echo /bin >> "$GITHUB_PATH"
          fi
      - name: Prepare declared development compiler and Wasm target
        if: ${{ needs.change-scope.outputs.scope == 'full' }}
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown
      - name: Restore ordinary workspace compilation cache
        if: ${{ needs.change-scope.outputs.scope == 'full' }}
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          # Archive verification always uses a fresh attempt-specific target.
          cache-targets: false
          cache-bin: false
          cache-directories: |
            target/debug
            target/wasm32-unknown-unknown/debug
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Prepare locked dependency cache
        if: ${{ needs.change-scope.outputs.scope == 'full' }}
        run: cargo fetch --locked
      - name: Prepare pinned local tools with the shared Cargo cache
        if: ${{ needs.change-scope.outputs.scope == 'full' }}
        uses: ./.github/actions/prepare-common-tools
        with:
          cache: 'true'
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-extra-key: ${{ hashFiles('ci/release-editor.env') }}
      - name: Run native CI and publication qualification
        if: ${{ needs.change-scope.outputs.scope == 'full' }}
        env:
          TMPDIR: ${{ runner.temp }}/portable-fixtures
        run: |
          mkdir -p "$TMPDIR"
          make ci-publication
      - name: Retain successful native qualification
        if: ${{ needs.change-scope.outputs.scope == 'full' }}
        uses: ./.github/actions/retain-qualification
        with:
          profile: native
          name: native-qualification-${{ matrix.runner }}-${{ github.run_attempt }}
      - name: Retain failure evidence
        if: ${{ failure() && needs.change-scope.outputs.scope == 'full' }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: native-failure-${{ matrix.runner }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
      - name: Retain product qualification evidence
        if: ${{ failure() && !cancelled() && needs.change-scope.outputs.scope == 'full' }}
        uses: ./.github/actions/retain-product-evidence

  # Keep the existing status name, reusing native's compiler-support proof.
  msrv:
    needs: [change-scope, native]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a successful classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.change-scope.result }}
          CHANGE_SCOPE: ${{ needs.change-scope.outputs.scope }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          [[ "$CLASSIFICATION_RESULT" == success && "$NATIVE_RESULT" == success ]] || exit 1
          case "$CHANGE_SCOPE" in docs|full) ;; *) exit 1 ;; esac
      - name: Validate documentation only
        if: ${{ needs.change-scope.outputs.scope == 'docs' }}
        run: echo 'Documentation checks passed in native jobs; compiler qualification was not run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Reuse native compiler qualification
        if: ${{ needs.change-scope.outputs.scope == 'full' }}
        run: echo 'The pinned compiler, native/Wasm and isolated consumer checks passed in all required native jobs. See their qualification artifacts.' >> "$GITHUB_STEP_SUMMARY"
