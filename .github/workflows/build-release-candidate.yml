name: Build release candidate

on:
  workflow_dispatch:
  push:
    branches: [main, release/build-readiness]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned Rust and repository components
        id: compiler
        env:
          CI_SETUP_ROOT: ${{ runner.temp }}/ic-tooling-setup
          TOKO_TOOLING_STORE: ${{ runner.temp }}/ic-tooling-setup/tools
        run: |
          printf 'CI_SETUP_ROOT=%s\nTOKO_TOOLING_STORE=%s\n' "$CI_SETUP_ROOT" "$TOKO_TOOLING_STORE" >> "$GITHUB_ENV"
          perl scripts/ci/setup-diagnostics.pl compiler rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@08d63df7661910554ef72980037f55edd914aba0 # 0.44.11
      - name: Prepare common tools
        id: tools
        run: perl scripts/ci/setup-diagnostics.pl tools make install-tools
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@08d63df7661910554ef72980037f55edd914aba0 # 0.44.11
        with:
          mode: save
      - name: Admit snapshot and Cargo pins
        run: make check
      - name: Check formatting without changing source
        run: make fmt-check
      - name: Retain setup diagnostics
        id: setup_evidence
        if: ${{ failure() && (steps.compiler.outcome == 'failure' || steps.tools.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.compiler.outputs.evidence }}
            ${{ steps.tools.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
      - name: Report setup evidence
        if: ${{ always() && (steps.compiler.outcome == 'failure' || steps.tools.outcome == 'failure') }}
        env:
          EVIDENCE_URL: ${{ steps.setup_evidence.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.setup_evidence.outcome }}
        run: |
          if [[ "$UPLOAD_OUTCOME" == success && -n "$EVIDENCE_URL" ]]; then
            printf 'Setup diagnostics: %s\n' "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Setup evidence missing or upload failed; inspect the sanitized setup excerpt.'
            exit 1
          fi
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@08d63df7661910554ef72980037f55edd914aba0 # 0.44.11
      - name: Prepare pinned secret scanner
        run: |
          scanner="$(bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh gitleaks --install-dir "$RUNNER_TEMP/ci-tools")"
          echo "GITLEAKS_BIN=$scanner" >> "$GITHUB_ENV"
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@08d63df7661910554ef72980037f55edd914aba0 # 0.44.11
        with:
          mode: save
      - name: Scan repository history once
        run: '"$GITLEAKS_BIN" git --redact=100 --no-banner --no-color --log-level error'
  libraries:
    needs: repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned Rust components
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@08d63df7661910554ef72980037f55edd914aba0 # 0.44.11
        with:
          extra-key: testkit-managed-server-pocketic-16.1.0
      - name: Prepare external simulator owner and server
        shell: bash
        run: |
          cargo fetch --locked
          cargo clippy -p ic-testkit --features cli --bin ic-testkit-server --locked --offline -- -D warnings
          make prepare-testkit-server-cli
          export TESTKIT_SERVER_CLI="$GITHUB_WORKSPACE/target/debug/ic-testkit-server"
          make test-pocketic-setup
          "$TESTKIT_SERVER_CLI" setup "$RUNNER_TEMP/pocket-ic" \
            "$RUNNER_TEMP/pocket-ic-setup-evidence" /usr/bin/curl /usr/bin/gzip
          echo "TESTKIT_SERVER_CLI=$TESTKIT_SERVER_CLI" >> "$GITHUB_ENV"
          echo "TESTKIT_SERVER_DIRECTORY=$RUNNER_TEMP/pocket-ic" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/pocket-ic-setup-evidence/archive.gz"
          test -f "$archive" && test ! -L "$archive"
          echo "TESTKIT_SERVER_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "TESTKIT_GZIP=/usr/bin/gzip" >> "$GITHUB_ENV"
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@08d63df7661910554ef72980037f55edd914aba0 # 0.44.11
        with:
          mode: save
          extra-key: testkit-managed-server-pocketic-16.1.0
      - name: Qualify command lifetime and failure cleanup
        id: simulator-qualification
        run: make test-testkit-server-cli
      - name: Qualify packaged HTTP, Text, Testkit and metadata editor
        id: library-qualification
        env:
          LIBRARY_RELEASE_ONLINE: 'true'
        run: bash scripts/qualification/library-release-candidate.sh http text testkit cargo-metadata
      - name: Retain library archives and evidence
        if: ${{ always() && (steps.library-qualification.outcome != 'skipped' || steps.simulator-qualification.outcome != 'skipped') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: library-candidate-${{ matrix.os }}
          retention-days: 7
          path: |
            target/library-release.*/archives/
            target/library-release.*/*.log
            target/library-release.*/*.json
            target/library-release.*/*.txt
            target/library-release.*/*.sha256
            target/library-release.*/source-head
            target/library-release.*/source.patch
            target/library-release.*/source.tar
            target/library-release.*/server/
            target/testkit-server-cli.*/
            target/library-release.*/candidate/Cargo.lock
          if-no-files-found: error
      - name: Retain simulator setup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocket-ic-setup-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/pocket-ic-setup-evidence/download.stdout
            ${{ runner.temp }}/pocket-ic-setup-evidence/download.stderr
            ${{ runner.temp }}/pocket-ic-setup-evidence/download.txt
            ${{ runner.temp }}/pocket-ic-setup-evidence/prepare.txt
            ${{ runner.temp }}/pocket-ic-setup-evidence/server.stdout
            ${{ runner.temp }}/pocket-ic-setup-evidence/server.stderr
            ${{ runner.temp }}/pocket-ic-setup-evidence/server.txt
          if-no-files-found: warn
  native:
    needs: repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned Rust and Wasm target
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
      - name: Qualify the four packaged crates
        env:
          BUILD_RELEASE_ONLINE: 'true'
          BUILD_RELEASE_CONSUMER: none
        run: bash scripts/qualification/build-release-candidate.sh
      - name: Retain candidate archives and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-candidate-${{ matrix.os }}
          path: |
            target/build-release.*/archives/
            target/build-release.*/*.log
            target/build-release.*/*.json
            target/build-release.*/*.sha256
            target/build-release.*/source-head
            target/build-release.*/source.patch
            target/build-release.*/complete.txt
          if-no-files-found: error
