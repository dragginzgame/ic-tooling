name: Build release candidate

on:
  workflow_dispatch:
  push:
    branches: [release/build-readiness]
  pull_request:
    paths:
      - 'crates/ic-build/**'
      - 'crates/ic-host-artifacts/**'
      - 'crates/ic-host-fs/**'
      - 'crates/ic-host-process/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'qualification/owned-wasm-probe/**'
      - 'qualification/Cargo.*'
      - 'scripts/qualification/build-release-candidate.sh'
      - '.github/workflows/build-release-candidate.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history once
        run: |
          scanner="$(bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh gitleaks --install-dir "$RUNNER_TEMP/ci-tools")"
          "$scanner" git --redact=100 --no-banner --no-color --log-level error
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned Rust and Wasm target
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Qualify the four packaged crates
        env:
          BUILD_RELEASE_ONLINE: 'true'
          BUILD_RELEASE_CONSUMER: none
        run: bash scripts/qualification/build-release-candidate.sh
      - name: Retain candidate archives and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-candidate-${{ matrix.os }}
          path: |
            target/build-release.*/archives/
            target/build-release.*/*.log
            target/build-release.*/*.json
            target/build-release.*/*.sha256
            target/build-release.*/source-head
            target/build-release.*/source.patch
            target/build-release.*/complete.txt
          if-no-files-found: error
