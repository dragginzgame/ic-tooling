name: Build release candidate

on:
  workflow_dispatch:
  push:
    branches: [main, release/build-readiness]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Measured budgets and evidence reserve: docs/qualification/ci-setup.md.
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Prepare pinned Rust and repository components
        id: compiler
        timeout-minutes: 3
        env:
          CI_SETUP_ROOT: ${{ runner.temp }}/ic-tooling-setup
          TOKO_TOOLING_STORE: ${{ runner.temp }}/ic-tooling-setup/tools
        run: |
          printf 'CI_SETUP_ROOT=%s\nTOKO_TOOLING_STORE=%s\n' "$CI_SETUP_ROOT" "$TOKO_TOOLING_STORE" >> "$GITHUB_ENV"
          perl scripts/ci/setup-diagnostics.pl compiler timeout --kill-after=10s 150s bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh --toolchain-file rust-toolchain.toml
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@76fb2f494d27e9b3d58442c8762a0b29c88392d6 # 0.45.21
        timeout-minutes: 1
      - name: Prepare common tools
        id: tools
        timeout-minutes: 5
        run: perl scripts/ci/setup-diagnostics.pl tools timeout --kill-after=10s 270s make install-tools
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@76fb2f494d27e9b3d58442c8762a0b29c88392d6 # 0.45.21
        timeout-minutes: 1
        with:
          mode: save
      - name: Admit snapshot and Cargo pins
        timeout-minutes: 1
        run: make check
      - name: Check setup diagnostic failure paths
        timeout-minutes: 1
        run: perl scripts/ci/test-setup-diagnostics.t
      - name: Check formatting without changing source
        timeout-minutes: 1
        run: make fmt-check
      - name: Retain setup diagnostics
        timeout-minutes: 2
        id: setup_evidence
        if: ${{ failure() && (steps.compiler.outcome == 'failure' || steps.tools.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.compiler.outputs.evidence }}
            ${{ steps.tools.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
      - name: Report setup evidence
        timeout-minutes: 1
        if: ${{ always() && (steps.compiler.outcome == 'failure' || steps.tools.outcome == 'failure') }}
        env:
          EVIDENCE_URL: ${{ steps.setup_evidence.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.setup_evidence.outcome }}
        run: |
          if [[ "$UPLOAD_OUTCOME" == success && -n "$EVIDENCE_URL" ]]; then
            printf 'Setup diagnostics: %s\n' "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Setup evidence missing or upload failed; inspect the sanitized setup excerpt.'
            exit 1
          fi
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@76fb2f494d27e9b3d58442c8762a0b29c88392d6 # 0.45.21
        timeout-minutes: 1
      - name: Prepare pinned secret scanner
        id: scanner
        timeout-minutes: 2
        env:
          CI_SETUP_ROOT: ${{ runner.temp }}/ic-tooling-security-setup
        run: |
          perl scripts/ci/setup-diagnostics.pl scanner timeout --kill-after=10s 90s \
            bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh gitleaks --install-dir "$CI_SETUP_ROOT/tools/scanner"
          echo "GITLEAKS_BIN=$CI_SETUP_ROOT/tools/scanner/gitleaks" >> "$GITHUB_ENV"
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@76fb2f494d27e9b3d58442c8762a0b29c88392d6 # 0.45.21
        timeout-minutes: 1
        with:
          mode: save
      - name: Scan repository history once
        timeout-minutes: 2
        run: '"$GITLEAKS_BIN" git --redact=100 --no-banner --no-color --log-level error'
      - name: Retain scanner setup diagnostics
        id: scanner_evidence
        timeout-minutes: 2
        if: ${{ failure() && steps.scanner.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scanner.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7
      - name: Report scanner setup evidence
        timeout-minutes: 1
        if: ${{ always() && steps.scanner.outcome == 'failure' }}
        env:
          EVIDENCE_URL: ${{ steps.scanner_evidence.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.scanner_evidence.outcome }}
        run: |
          if [[ "$UPLOAD_OUTCOME" == success && -n "$EVIDENCE_URL" ]]; then
            printf 'Scanner setup diagnostics: %s\n' "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Scanner setup evidence missing or upload failed; inspect the sanitized setup excerpt.'
            exit 1
          fi
  libraries:
    needs: repository
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Prepare pinned Rust components
        timeout-minutes: 3
        run: bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh --toolchain-file rust-toolchain.toml
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@76fb2f494d27e9b3d58442c8762a0b29c88392d6 # 0.45.21
        timeout-minutes: 1
        with:
          extra-key: testkit-managed-server-pocketic-16.1.0
      - name: Prepare external simulator owner and server
        timeout-minutes: 15
        shell: bash
        run: |
          cargo fetch --locked
          cargo clippy -p ic-testkit --features cli --bin ic-testkit-server --locked --offline -- -D warnings
          make prepare-testkit-server-cli
          export TESTKIT_SERVER_CLI="$GITHUB_WORKSPACE/target/debug/ic-testkit-server"
          make test-pocketic-setup
          "$TESTKIT_SERVER_CLI" setup "$RUNNER_TEMP/pocket-ic" \
            "$RUNNER_TEMP/pocket-ic-setup-evidence" /usr/bin/curl /usr/bin/gzip
          echo "TESTKIT_SERVER_CLI=$TESTKIT_SERVER_CLI" >> "$GITHUB_ENV"
          echo "TESTKIT_SERVER_DIRECTORY=$RUNNER_TEMP/pocket-ic" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/pocket-ic-setup-evidence/archive.gz"
          test -f "$archive" && test ! -L "$archive"
          echo "TESTKIT_SERVER_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "TESTKIT_GZIP=/usr/bin/gzip" >> "$GITHUB_ENV"
      - uses: dragginzgame/toko-tooling/.github/actions/cache-tool-downloads@76fb2f494d27e9b3d58442c8762a0b29c88392d6 # 0.45.21
        timeout-minutes: 1
        with:
          mode: save
          extra-key: testkit-managed-server-pocketic-16.1.0
      - name: Qualify command lifetime and failure cleanup
        timeout-minutes: 4
        id: simulator-qualification
        run: make test-testkit-server-cli
      - name: Qualify packaged HTTP, Text, Testkit and metadata editor
        timeout-minutes: 12
        id: library-qualification
        env:
          LIBRARY_RELEASE_ONLINE: 'true'
        run: bash scripts/qualification/library-release-candidate.sh http text testkit cargo-metadata
      - name: Retain library archives and evidence
        timeout-minutes: 2
        if: ${{ always() && (steps.library-qualification.outcome != 'skipped' || steps.simulator-qualification.outcome != 'skipped') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: library-candidate-${{ matrix.os }}
          retention-days: 7
          path: |
            target/library-release.*/archives/
            target/library-release.*/*.log
            target/library-release.*/*.json
            target/library-release.*/*.txt
            target/library-release.*/*.sha256
            target/library-release.*/source-head
            target/library-release.*/source.patch
            target/library-release.*/source.tar
            target/library-release.*/server/
            target/testkit-server-cli.*/
            target/library-release.*/candidate/Cargo.lock
          if-no-files-found: error
      - name: Retain simulator setup diagnostics
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocket-ic-setup-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/pocket-ic-setup-evidence/download.stdout
            ${{ runner.temp }}/pocket-ic-setup-evidence/download.stderr
            ${{ runner.temp }}/pocket-ic-setup-evidence/download.txt
            ${{ runner.temp }}/pocket-ic-setup-evidence/prepare.txt
            ${{ runner.temp }}/pocket-ic-setup-evidence/server.stdout
            ${{ runner.temp }}/pocket-ic-setup-evidence/server.stderr
            ${{ runner.temp }}/pocket-ic-setup-evidence/server.txt
          if-no-files-found: warn
  signer-provider:
    needs: repository
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CI_SETUP_ROOT: ${{ github.workspace }}/target/sign-provider-setup
      SIGNER_TEST_DISPOSABLE_KEYCHAIN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Prepare pinned compiler
        id: compiler
        timeout-minutes: 3
        run: perl scripts/ci/setup-diagnostics.pl compiler bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh --workspace-manifest Cargo.toml
      - name: Prepare the pinned ICP identity producer and native tools
        id: tools
        timeout-minutes: 6
        shell: bash
        run: |
          perl scripts/ci/setup-diagnostics.pl tools bash -c '
            set -euo pipefail
            if [[ "$RUNNER_OS" == Linux ]]; then
              sudo apt-get update
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y dbus-x11 gnome-keyring strace
            else
              test -x /usr/bin/sandbox-exec
            fi
            prepared=$(bash vendor/toko-tooling/scripts/dev/install-ic-tools.sh \
              --tool icp --consumer "$GITHUB_WORKSPACE")
            printf "SIGNER_TEST_ICP=%s/icp\n" "$prepared" >> "$GITHUB_ENV"
            cargo fetch --locked
          '
      - name: Qualify the actual noninteractive credential provider
        id: provider
        timeout-minutes: 8
        run: make test-sign-keyring
      - name: Retain selected provider evidence
        timeout-minutes: 2
        if: ${{ always() && steps.provider.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signer-provider-${{ matrix.os }}
          retention-days: 7
          path: |
            target/sign-keyring.*/build.log
            target/sign-keyring.*/test.log
            target/sign-keyring.*/network.trace
            target/sign-keyring.*/prompt-profile.log
            target/sign-keyring.*/prompt-monitor.log
            target/sign-keyring.*/source.sha256
            target/sign-keyring.*/source-after.sha256
            target/sign-keyring.*/source-head
            target/sign-keyring.*/host.txt
            target/sign-keyring.*/tool-versions.txt
          if-no-files-found: error
      - name: Retain sanitized provider setup failures
        id: setup_evidence
        timeout-minutes: 2
        if: ${{ failure() && (steps.compiler.outcome == 'failure' || steps.tools.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-signer-provider-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ steps.compiler.outputs.evidence }}
            ${{ steps.tools.outputs.evidence }}
          if-no-files-found: error
      - name: Report provider setup evidence
        timeout-minutes: 1
        if: ${{ always() && (steps.compiler.outcome == 'failure' || steps.tools.outcome == 'failure') }}
        env:
          EVIDENCE_URL: ${{ steps.setup_evidence.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.setup_evidence.outcome }}
        run: |
          if [[ "$UPLOAD_OUTCOME" == success && -n "$EVIDENCE_URL" ]]; then
            printf 'Provider setup diagnostics: %s\n' "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Provider setup evidence missing or upload failed; inspect the sanitized setup excerpt.'
            exit 1
          fi
  native:
    needs: repository
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Prepare pinned Rust and Wasm target
        timeout-minutes: 3
        run: bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh --workspace-manifest Cargo.toml --component clippy --component rustfmt --target wasm32-unknown-unknown
      - name: Qualify the four packaged crates
        timeout-minutes: 8
        env:
          BUILD_RELEASE_ONLINE: 'true'
          BUILD_RELEASE_CONSUMER: none
        run: bash scripts/qualification/build-release-candidate.sh
      - name: Prepare signer dependencies
        id: signer_dependencies
        timeout-minutes: 3
        env:
          CI_SETUP_ROOT: ${{ runner.temp }}/native-signer-setup
        run: perl scripts/ci/setup-diagnostics.pl tools cargo fetch --locked
      - name: Check signer admission and cancellation on the native host
        timeout-minutes: 8
        run: make test-sign
      - name: Retain candidate archives and evidence
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-candidate-${{ matrix.os }}
          retention-days: 7
          path: |
            target/build-release.*/archives/
            target/build-release.*/*.log
            target/build-release.*/*.json
            target/build-release.*/*.sha256
            target/build-release.*/source-head
            target/build-release.*/source.patch
            target/build-release.*/complete.txt
            ${{ steps.signer_dependencies.outputs.evidence }}
          if-no-files-found: error
