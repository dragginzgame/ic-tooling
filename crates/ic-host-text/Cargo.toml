[package]
name = "ic-host-text"
edition.workspace = true
rust-version.workspace = true
version = "0.73.3"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure bounded text decoding, normalization and terminal-safe Unicode rendering"
readme = "../../README.md"
publish = ["crates-io"]

[features]
default = []
yaml = ["dep:serde", "dep:yaml_serde"]

[dependencies]
serde = { workspace = true, features = ["std"], optional = true }
unicode-width.workspace = true
yaml_serde = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive", "std"] }

[lints]
workspace = true
