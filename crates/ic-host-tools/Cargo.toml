[package]
name = "ic-host-tools"
edition.workspace = true
rust-version.workspace = true
version = "0.86.0"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Host-side Candid interfaces and ICP responses"
readme = "../../README.md"
publish = ["crates-io"]

[features]
default = []
agent = ["dep:ic-platform", "ic-platform/agent", "dep:url"]
candid = ["dep:ic-platform", "ic-platform/candid", "ic-platform/candid-parser"]
encoding = []
ic-interface = ["dep:ic-host-artifacts", "ic-host-artifacts/wasm"]
icp-ledger = ["dep:prost"]
icp-project = ["dep:ic-host-text", "ic-host-text/yaml"]
ledger-evidence = [
    "dep:ic-platform",
    "ic-platform/candid",
    "ic-platform/icrc-ledger-types",
]
registry = ["dep:ic-platform-types", "dep:prost"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
url = { workspace = true, optional = true }

[dependencies]
ic-host-artifacts = { workspace = true, optional = true }
ic-host-text = { workspace = true, optional = true }
ic-platform = { workspace = true, optional = true }
ic-platform-types = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
ic-host-artifacts.workspace = true
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }

leb128.workspace = true

[[test]]
name = "public_decode"
required-features = ["candid"]

[lints]
workspace = true
