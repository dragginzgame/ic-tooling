[package]
license.workspace = true
name = "ic-testkit-perf-probe"
edition.workspace = true
rust-version.workspace = true
version = "0.86.0"
publish = false
repository.workspace = true

[package.metadata.shared-tooling.loc]
category = "benchmarks"

[package.metadata.shared-tooling.loc.paths]
"src/protocol/tests.rs" = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ic-wire = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-testkit = { workspace = true }

[lints]
workspace = true
