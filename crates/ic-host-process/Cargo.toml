[package]
name = "ic-host-process"
edition.workspace = true
rust-version.workspace = true
version = "0.76.2"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native process observations and admitted execution"
readme = "../../README.md"
publish = ["crates-io"]

[target.'cfg(unix)'.dependencies]
command-fds.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["pipe", "process", "time"] }

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
test-support = []

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["thread"] }

[dependencies]
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
ic-host-fs = { workspace = true, features = ["test-support"] }
toko-tooling.workspace = true

[lints]
workspace = true
