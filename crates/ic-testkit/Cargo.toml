[package]
name = "ic-testkit"
version = "0.107.4"
description = "Shared PocketIC types, held-reply fixtures and optional bounded server ownership"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[[bin]]
name = "ic-testkit-server"
required-features = ["cli"]

[features]
default = []
cli = ["managed-server", "dep:clap", "dep:ctrlc", "dep:ic-host-text"]
managed-server = [
    "dep:ic-host-artifacts",
    "dep:ic-host-fs",
    "dep:ic-host-process",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tokio",
]
held-reply-fixtures = [
    "dep:thiserror",
    "dep:ic-platform-protocol",
    "dep:ic-platform-types",
    "dep:wat",
]

[dependencies]
clap = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
ic-host-artifacts = { workspace = true, optional = true }
ic-host-fs = { workspace = true, optional = true }
ic-host-process = { workspace = true, optional = true }
ic-host-text = { workspace = true, optional = true }
ic-platform-protocol = { workspace = true, optional = true, features = ["http-request"] }
ic-platform-types = { workspace = true, optional = true }
pocket-ic.workspace = true
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
wat = { workspace = true, optional = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["rt", "net", "time"] }
wasmparser.workspace = true

[[example]]
name = "prepare_server"
required-features = ["managed-server"]

[lints]
workspace = true
