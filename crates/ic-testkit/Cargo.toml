[package]
publish = ["crates-io"]
name = "ic-testkit"
edition.workspace = true
rust-version.workspace = true
version = "0.104.0"
license-file.workspace = true
authors.workspace = true
description = "PocketIC-oriented test utilities for IC canister tests"
readme = "README.md"
repository.workspace = true
keywords = ["internet-computer", "canister", "dfinity", "icp", "testing"]
categories = ["development-tools::testing", "wasm"]

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[[bin]]
name = "ic-testkit-server"
path = "src/bin/ic-testkit-server.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "clap/derive"]
reply-fixtures = ["dep:wasm-encoder"]
held-reply-fixtures = ["reply-fixtures", "ic-host-artifacts/wasm-text"]

[target.'cfg(all(unix, not(target_family = "wasm")))'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap = { workspace = true, features = ["string"], optional = true }
ic-host-artifacts = { workspace = true, features = ["gzip"] }
ic-host-fs = { workspace = true }
ic-host-process = { workspace = true }
# Native snapshots and held fixtures adapt external management protocols.
ic-platform = { workspace = true, features = ["candid-codec", "management-canister-types"] }
pocket-ic.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
url.workspace = true
wasm-encoder = { workspace = true, optional = true }

[dependencies]
ic-platform-types.workspace = true
thiserror = { workspace = true }

[target.'cfg(all(unix, not(target_family = "wasm")))'.dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
clap = { workspace = true, features = ["string"] }
ic-host-artifacts = { workspace = true, features = ["wasm-validation", "wasm-text"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }

[dev-dependencies]
toko-tooling.workspace = true

[[test]]
name = "server_runner"
required-features = ["cli"]

[[test]]
name = "client_installed"
path = "tests/client_installed/main.rs"

[lints]
workspace = true
