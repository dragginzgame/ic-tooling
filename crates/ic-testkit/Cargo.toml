[package]
name = "ic-testkit"
version = "0.107.1"
description = "Shared PocketIC types and bounded held-reply test fixtures"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[features]
default = []
held-reply-fixtures = [
    "dep:thiserror",
    "dep:ic-platform-protocol",
    "dep:ic-platform-types",
    "dep:wat",
]

[dependencies]
ic-platform-protocol = { workspace = true, optional = true, features = ["http-request"] }
ic-platform-types = { workspace = true, optional = true }
pocket-ic.workspace = true
thiserror = { workspace = true, optional = true }
wat = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "net", "time"] }
wasmparser.workspace = true

[lints]
workspace = true
