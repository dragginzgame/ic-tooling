[package]
name = "ic-host-wasm-inspect"
edition.workspace = true
rust-version.workspace = true
version = "0.76.4"
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bounded structural Wasm inspection CLI"
readme = "README.md"
publish = ["crates-io"]

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
ic-host-artifacts = { workspace = true, features = ["wasm"] }
ic-host-fs.workspace = true

[dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
toko-tooling.workspace = true

[lints]
workspace = true
