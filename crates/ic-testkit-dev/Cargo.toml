[package]
name = "ic-testkit-dev"
edition.workspace = true
rust-version.workspace = true
version = "0.87.0"
license.workspace = true
publish = false
repository.workspace = true

[package.metadata.shared-tooling.loc]
category = "build_tooling"

[package.metadata.shared-tooling.loc.paths]
"src/bin/tests/mod.rs" = "tests"
"src/fixture_reuse_driver/arguments/tests.rs" = "tests"
"src/fixture_reuse_driver/report/tests.rs" = "tests"
"src/fixture_reuse_driver/tests.rs" = "tests"
"src/fixture_reuse_protocol/tests.rs" = "tests"
"src/statistics/tests.rs" = "tests"
"src/workload/tests.rs" = "tests"
"src/workload.rs" = "benchmarks"
"tests" = "tests"

[dependencies]
clap = { workspace = true, features = ["derive", "string"] }
ic-build = { workspace = true }
ic-host-artifacts = { workspace = true }
ic-host-fs = { workspace = true, features = ["temporary-file"] }
ic-host-process = { workspace = true }
ic-host-text = { workspace = true }
ic-platform-types = { workspace = true, features = ["principal-external"] }
ic-testkit = { workspace = true, features = ["wire"] }
ic-testkit-perf-probe = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-tools = { workspace = true, features = ["registry"] }
ic-platform = { workspace = true, features = ["principal", "ic-protocol"] }
ic-wire.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
