[package]
name = "ic-testkit-dev"
edition.workspace = true
rust-version.workspace = true
version = "0.93.1"
license.workspace = true
publish = false
repository.workspace = true

[package.metadata.shared-tooling.loc]
category = "build_tooling"

[package.metadata.shared-tooling.loc.paths]
"src/bin/tests/mod.rs" = "tests"
"tests" = "tests"

[[bin]]
name = "internet_identity_fixture"
path = "tests/support/internet_identity_fixture.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "string"] }
ic-build = { workspace = true }
ic-host-artifacts = { workspace = true, features = ["wasm-text"] }
ic-host-fs = { workspace = true }
ic-host-process = { workspace = true }
ic-host-text = { workspace = true }
ic-testkit = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }

[dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-tools = { workspace = true, features = ["registry"] }
ic-platform = { workspace = true, features = ["principal", "ic-protocol"] }
ic-platform-types = { workspace = true, features = ["principal-external"] }
ic-testkit = { workspace = true, features = ["wire"] }
ic-testkit-perf-probe.workspace = true
ic-wire.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
