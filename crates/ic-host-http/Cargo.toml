[package]
name = "ic-host-http"
edition.workspace = true
rust-version.workspace = true
version = "0.76.1"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bounded HTTP response bodies with caller-selected failure evidence"
readme = "README.md"
publish = ["crates-io"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ic-host-artifacts.workspace = true
reqwest.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ic-host-artifacts = { workspace = true, features = ["gzip"] }
reqwest = { workspace = true, features = ["gzip"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
