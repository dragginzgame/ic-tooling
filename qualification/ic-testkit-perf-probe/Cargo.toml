[package]
license.workspace = true
name = "ic-testkit-perf-probe"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false
repository.workspace = true

[package.metadata.toko-tooling.loc]
category = "benchmarks"

[package.metadata.toko-tooling.loc.paths]
"src/protocol/tests.rs" = "tests"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ic-wire = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["cdk"] }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
