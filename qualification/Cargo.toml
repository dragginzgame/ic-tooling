[workspace]
members = ["ic-testkit-dev", "ic-testkit-perf-probe"]
resolver = "3"

[workspace.package]
version = "0.96.0"
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"
repository = "https://github.com/dragginzgame/ic-tooling"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Host-side artifact, filesystem, process and IC tooling"

[workspace.dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
ic-build = { path = "../crates/ic-build", version = "0.84.0", default-features = false }
ic-host-artifacts = { path = "../crates/ic-host-artifacts", version = "0.77.0", default-features = false }
ic-host-fs = { path = "../crates/ic-host-fs", version = "0.77.0", default-features = false }
ic-host-process = { path = "../crates/ic-host-process", version = "0.77.0", default-features = false }
ic-host-text = { path = "../crates/ic-host-text", version = "0.74.5", default-features = false }
ic-host-tools = { path = "../crates/ic-host-tools", version = "0.91.0", default-features = false }
ic-platform = { version = "0.32.0", default-features = false }
ic-platform-runtime = { version = "0.22.0", default-features = false }
ic-platform-types = { version = "0.20.0", default-features = false }
ic-testkit = { path = "../crates/ic-testkit", version = "0.101.0", default-features = false }
ic-testkit-perf-probe = { path = "ic-testkit-perf-probe", version = "0.96.0" }
ic-wire = "0.21.0"
libc = "0.2.190"
pocket-ic = "16.1.0"
serde = { version = "1.0.228", default-features = false }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false }
toko-tooling = "=0.40.1"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# Reviewed macOS process queries and scoped Unix signal actions permit local FFI.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
# Match product API/style checks without blanket experimental lint groups.
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
